services:
  - type: web
    name: raganork-bot
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SESSION
        value: ""
      - key: RENDER_API_KEY
        value: ""
      - key: DATABASE_URL
        fromDatabase:
          name: raganork-db
          property: connectionString
